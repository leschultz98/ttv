<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebNovel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz@7..72&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-color: #121212;
        --text-color: #e0e0e0;
      }

      body {
        margin: 0;
        padding: 16px;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: 'Literata', serif;
        font-size: 18px;
        line-height: 1.6;
      }

      svg {
        display: block;
        margin: 0 auto;
      }

      main {
        white-space: pre-line;
      }

      footer {
        padding: 16px 0;
        display: flex;
        justify-content: space-between;
      }

      a {
        all: unset;
        padding: 4px 8px;
        border: 1px solid;
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <svg width="60" height="60" viewBox="0 0 44 44">
      <circle cx="22" cy="22" r="6" fill="none" stroke="#60A5FA" stroke-width="2">
        <animate attributeName="r" from="6" to="20" dur="1.5s" begin="0s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" from="1" to="0" dur="1.5s" begin="0s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="22" cy="22" r="6" fill="none" stroke="#60A5FA" stroke-width="2">
        <animate attributeName="r" from="6" to="20" dur="1.5s" begin="0.5s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" from="1" to="0" dur="1.5s" begin="0.5s" repeatCount="indefinite"></animate>
      </circle>
    </svg>
    <h2></h2>
    <main></main>
    <footer>
      <a>Back</a>
      <a>Next</a>
    </footer>

    <script>
      const TITLE_REGEX = /<title>([\s\S]*?)<\/title>/;
      const CONTENT_REGEX = /<div class="truyen">([\s\S]*?)<\/div>/;
      const BACK_REGEX = /href='(.+?)' class='back'/;
      const NEXT_REGEX = /href='(.+?)' class='next'/;

      let svgEl = document.querySelector('svg');
      const titleEl = document.querySelector('title');
      const h2El = document.querySelector('h2');
      const mainEl = document.querySelector('main');
      const [backEl, nextEl] = document.querySelectorAll('a');

      backEl.addEventListener('click', backHandler);
      nextEl.addEventListener('click', nextHandler);

      const texts = [];
      let currentIndex = 0;

      async function get(url = location.pathname) {
        const response = await fetch('/api' + url);
        texts.push([url, await response.text()]);
      }

      async function update() {
        if (svgEl) {
          svgEl.remove();
          svgEl = null;
        }

        const [url, text] = texts[currentIndex];
        window.history.replaceState({}, '', url);

        titleEl.innerHTML = h2El.innerHTML = text.match(TITLE_REGEX)[1];
        mainEl.innerHTML = text.match(CONTENT_REGEX)[1].trim();
        if (!mainEl.innerHTML.includes('br')) {
          mainEl.innerHTML = mainEl.innerHTML.replace(/([.!?…])\s*/g, '$1<br><br>');
        }
        backEl.href = text.match(BACK_REGEX)[1];

        const next = text.match(NEXT_REGEX)[1];
        nextEl.href = next;

        window.scrollTo(0, 0);

        if (currentIndex === texts.length - 1) {
          await get(next);
        }
      }

      function backHandler(event) {
        currentIndex--;
        if (currentIndex > -1) {
          event.preventDefault();
          update();
        }
      }

      function nextHandler(event) {
        currentIndex++;
        if (currentIndex < texts.length) {
          event.preventDefault();
          update();
        }
      }

      get().then(update);
    </script>
  </body>
</html>
